[project]
name = "pac-man"
version = "0.1.0"
description = "Pac-Man"
requires-python = ">=3.10"
dependencies = [
    "flake8>=7.3.0",
    "mlx",
    "mypy>=2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pac_man"]

[tool.mypy]
exclude = '^mazegenerator/'

[tool.uv.sources]
mlx = { path = "mlx-2.2-py3-none-any.whl" }

# pyproject.toml
[[tool.mypy.overrides]]
module = "mlx"
ignore_missing_imports = true